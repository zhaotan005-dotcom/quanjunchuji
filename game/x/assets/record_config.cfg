##record_config.cfg录屏配置

# EngineType:
- Unity:1
- Cocos2d:2
- UnrealEngine:3
EngineType=3

# DefaultVideoTitle: 默认视频标题
ManualDefaultVideoTitle=《绝地求生 全军出击》出击时刻
MomentDefaultVideoTitle=《绝地求生 全军出击》出击时刻

# DefaultShareVideoDescription: 分享视频描述
DefaultShareVideoDescription=快来围观我的精彩操作吧！

# AppliactionName: 应用名
AppliactionName=绝地求生 全军出击

# SupportedRecordingMode: 视频列表tab标题
- Manual
- Moments
Manual=自由录制
Moments=出击时刻


# DefaultManualRecorderPosition: 默认自由录制位置
-x = 0~1
-y = 0~1
x=0.5
y=0.5

# VideoListWXShareChannels :视频管理列表微信分享渠道（以英文逗号隔开）可选值如下：
-TYPE_WX = 3
-TYPE_WXFC = 4
-TYPE_WXGC = 5
-TYPE_COPY_LINK = 6
VideoListWXShareChannels = 3, 4, 5

# VideoListQQShareChannels :视频管理列表QQ分享渠道（以英文逗号隔开）可选值如下：
-TYPE_QQ = 0
-TYPE_QZ = 1
-TYPE_QQGC = 2
-TYPE_COPY_LINK = 6
VideoListQQShareChannels = 0, 1, 2

# MomentWXShareChannels :时刻录制生成窗口微信分享渠道（以英文逗号隔开）可选值如下
-TYPE_WX = 3
-TYPE_WXFC = 4
-TYPE_WXGC = 5
-TYPE_COPY_LINK = 6
MomentWXShareChannels = 3, 4, 5


# MomentQQShareChannels :时刻录制生成窗口QQ分享渠道（以英文逗号隔开）可选值如下：
-TYPE_QQ = 0
-TYPE_QZ = 1
-TYPE_QQGC = 2
-TYPE_COPY_LINK = 6
MomentQQShareChannels = 0, 1, 2


# 时刻录制生成窗口显示的标题
-MomentCutVideoTitle：小视频显示的标题，这里只是配置窗口显示的标题，不影响分享出去的标题
-MomentCompoundVideoTitle：合辑视频显示的标题，这里只是配置窗口显示的标题，不影响分享出去的标题
MomentCutVideoTitle=出击时刻
MomentCompoundVideoTitle=出击时刻


